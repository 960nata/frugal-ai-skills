<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="frugal-ai-skills — battle-tested agent skills for AI apps that survive free tiers">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#11261f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#a3e635"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="24" fill="url(#grid)"/>

  <!-- coin / gauge mark -->
  <g transform="translate(1010 200)">
    <circle r="120" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="18"/>
    <path d="M -104 60 A 120 120 0 1 1 104 60" fill="none" stroke="url(#accent)" stroke-width="18" stroke-linecap="round" stroke-dasharray="520 1000"/>
    <line x1="0" y1="0" x2="-62" y2="-58" stroke="#e5e7eb" stroke-width="8" stroke-linecap="round"/>
    <circle r="14" fill="#e5e7eb"/>
    <text x="0" y="78" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#9ca3af">quota left: plenty</text>
  </g>

  <text x="72" y="150" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="72" font-weight="800" fill="#f9fafb">frugal<tspan fill="url(#accent)">-ai-</tspan>skills</text>
  <text x="74" y="208" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="28" fill="#d1d5db">Battle-tested agent skills for AI apps</text>
  <text x="74" y="246" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="28" fill="#d1d5db">that survive free tiers, rate limits &amp; hallucinations.</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#0b1220">
    <rect x="74" y="292" width="136" height="38" rx="19" fill="#34d399"/><text x="142" y="317" text-anchor="middle">Claude Code</text>
    <rect x="222" y="292" width="96" height="38" rx="19" fill="#a3e635"/><text x="270" y="317" text-anchor="middle">Codex</text>
    <rect x="330" y="292" width="146" height="38" rx="19" fill="#5eead4"/><text x="403" y="317" text-anchor="middle">Antigravity</text>
    <rect x="488" y="292" width="140" height="38" rx="19" fill="#fde68a"/><text x="558" y="317" text-anchor="middle">Gemini CLI</text>
  </g>
</svg>
